services:
  app:
    build:
      context: ./docker/php
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    volumes:
      - ./src:/var/www/html
    depends_on:
      - db

  web:
    image: nginx:stable-alpine
    ports:
      - "8001:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: secret
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  node:
    image: node:22-alpine
    working_dir: /var/www/html
    user: "${USER_ID:-1000}:${GROUP_ID:-1000}"
    environment:
      HOME: /tmp
    volumes:
      - ./src:/var/www/html
    profiles: ["tools"]

volumes:
  db_data: